[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpcd-research-harness"
version = "0.2.0"
description = "Portable, evidence-gated research harness for Random-Permutation Coordinate Descent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sympy>=1.14"]

[project.scripts]
rpcd-harness = "rpcd_harness.cli:main"

[tool.setuptools.packages.find]
include = ["rpcd_harness*"]
