name: verify-rpcd-harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m rpcd_harness audit-ledger
      - run: python scripts/verify_rpcd_identities.py
      - run: python scripts/search_rpcd_counterexample.py --n 3 --sigma 0.4 --samples 3 --seed 7
      - run: python research/iteration6/route_stitch/verify_extremal_geometry.py
      - run: python research/iteration6/route_stitch/verify_spectral_rank2_region.py
      - run: python research/iteration6/route_stitch/verify_continuation_obstructions.py
      - run: python research/iteration6/route_stitch/independent_l3_audit.py
      - run: python research/iteration6/route_stitch/independent_w4_matching_audit.py
      - run: python research/iteration6/route_stitch/independent_w4_three_path_all_d_audit.py
      - run: python research/iteration6/route_stitch/independent_w4_equal_star_audit.py
